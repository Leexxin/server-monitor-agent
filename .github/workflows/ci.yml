name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"

      - name: Vet
        run: go vet ./...

      - name: Lifecycle script regression tests
        run: |
          sh scripts/test-lifecycle.sh
          sh scripts/test-procd.sh
          if grep -nE '^[[:space:]]*install[[:space:]]' packaging/universal/install.sh scripts/install-sma.sh; then
            echo 'Runtime installer must not require the optional install utility.' >&2
            exit 1
          fi

      - name: Validate release and installer scripts
        run: |
          sh -n packaging/universal/install.sh scripts/install-sma.sh scripts/prepare-share.sh scripts/publish-share.sh scripts/deploy-share.sh scripts/test-auto-installer-linux.sh scripts/test-universal-linux.sh scripts/test-share-publisher.sh
          python3 -m py_compile scripts/test-share-server.py

      - name: Test with race detector
        run: go test -race ./...

      - name: Cross-compile Linux targets
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...
