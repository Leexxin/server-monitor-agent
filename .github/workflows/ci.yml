name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"

      - name: Vet
        run: go vet ./...

      - name: Lifecycle script regression tests
        run: |
          sh scripts/test-lifecycle.sh
          sh scripts/test-procd.sh
          if grep -nE '^[[:space:]]*install[[:space:]]' packaging/universal/install.sh scripts/install-sma.sh; then
            echo 'Runtime installer must not require the optional install utility.' >&2
            exit 1
          fi

      - name: Validate release and installer scripts
        run: |
          sh -n packaging/universal/install.sh scripts/install-sma.sh scripts/prepare-share.sh scripts/publish-share.sh scripts/deploy-share.sh scripts/test-auto-installer-linux.sh scripts/test-universal-linux.sh scripts/test-share-publisher.sh
          python3 -m py_compile scripts/test-share-server.py

      - name: Test with race detector
        run: go test -race ./...

      - name: Cross-compile Linux targets
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...

  deb-integration:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Install pinned package builder
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          mkdir -p "$GOBIN"
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Build and stage 0.2.9 packages
        run: |
          sh scripts/build-packages.sh 0.2.9
          sh scripts/prepare-share.sh 0.2.9

      - name: Test renamed DEB lifecycle
        run: sudo env SMA_RUN_INSTALL_TESTS=1 sh scripts/test-install-linux.sh dist/packages/server-monitor-agent_0.2.9_linux_amd64.deb

      - name: Test legacy migration and unrelated sma isolation
        run: sudo env SMA_RUN_INSTALL_TESTS=1 NFPM_BIN="$(command -v nfpm)" sh scripts/test-auto-installer-linux.sh dist/share-v0.2.9 0.2.9
