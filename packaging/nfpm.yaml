# yaml-language-server: $schema=https://nfpm.goreleaser.com/schema.json
name: sma
arch: ${NFPM_ARCH}
platform: linux
version: ${NFPM_VERSION}
release: ${NFPM_RELEASE}
version_schema: semver
section: admin
priority: optional
maintainer: SMA Project <root@localhost>
description: Lightweight Linux server metrics agent exposing Prometheus and JSON APIs.
vendor: SMA Project
license: Proprietary
umask: 0o022

contents:
  - src: dist/stage/package/sma
    dst: /opt/sma/bin/sma
    file_info:
      mode: 0755
      owner: root
      group: root
  - src: packaging/config/sma.env
    dst: /opt/sma/config/sma.env
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: root
  - src: packaging/systemd/sma.service
    dst: /usr/lib/systemd/system/sma.service
    packager: deb
    file_info:
      mode: 0644
      owner: root
      group: root
  - src: packaging/systemd/sma.service
    dst: /usr/lib/systemd/system/sma.service
    packager: rpm
    file_info:
      mode: 0644
      owner: root
      group: root
  - src: packaging/openrc/sma
    dst: /etc/init.d/sma
    packager: apk
    file_info:
      mode: 0755
      owner: root
      group: root
  - src: README.md
    dst: /opt/sma/README.md
    file_info:
      mode: 0644
      owner: root
      group: root
  - src: docs/api-integration.md
    dst: /opt/sma/docs/api-integration.md
    file_info:
      mode: 0644
      owner: root
      group: root
  - src: docs/server-monitor-agent-development.md
    dst: /opt/sma/docs/server-monitor-agent-development.md
    file_info:
      mode: 0644
      owner: root
      group: root
  - src: docs/installation.md
    dst: /opt/sma/docs/installation.md
    file_info:
      mode: 0644
      owner: root
      group: root

scripts:
  preinstall: packaging/scripts/preinstall.sh
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
  postremove: packaging/scripts/postremove.sh

deb:
  compression: gzip

rpm:
  compression: gzip
  group: System Environment/Daemons
